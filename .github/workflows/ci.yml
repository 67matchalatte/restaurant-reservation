name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Клонирование репозитория
      uses: actions/checkout@v4

    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install ruff pytest
        if [ -f requirements.txt ]; then pip install --only-binary :all: -r requirements.txt; fi

    - name: Проверка кода линтером (Ruff)
      run: |
        ruff check .

    - name: Запуск тестов с покрытием (pytest-cov)
      run: |
        pip install pytest-cov
        pytest -v --cov=services --cov=db --cov-report=term-missing --cov-fail-under=60
