name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Клонирование репозитория
      uses: actions/checkout@v4

    - name: Установка Python
      uses: actions/setup-python@v5
      with:
        python-version: "3.10"

    - name: Установка зависимостей
      run: |
        python -m pip install --upgrade pip
        pip install flake8 pytest
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Проверка кода линтером (flake8)
      run: |
        # Проверяем только на синтаксические ошибки и неопределенные имена, чтобы не завалить сборку из-за пробелов
        flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics

    - name: Запуск тестов (pytest)
      run: |
        # Если тестов нет, шаг не упадет с ошибкой
        pytest || echo "Тесты не найдены или не прошли"
