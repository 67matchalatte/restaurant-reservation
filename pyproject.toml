[project]
name = "restaurant-reservation"
version = "0.1.0"
description = "Прототип системы бронирования столиков"
requires-python = ">=3.10"

[tool.ruff]
# Устанавливаем максимальную длину строки в 100 символов (стандарт для Python)
line-length = 100

[tool.ruff.lint]
# Отключаем правило E501 (слишком длинная строка), чтобы оно не мешало, 
# так как мы проверяем длину через line-length выше.
# Выбираем базовые правила: синтаксические ошибки (E, F), импорты (I).
select = ["E", "F", "I", "W"]
ignore = ["E501"]

[tool.ruff.format]
# Использовать двойные кавычки для строк
quote-style = "double"
