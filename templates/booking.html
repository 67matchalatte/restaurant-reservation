{% extends "base.html" %}{% block body %}
<h3>Оформление брони — столик {{ table_id }}</h3>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('booking_create') }}">
 <input type="hidden" name="table_id" value="{{ table_id }}">
 Имя<br><input name="name" required><br>
 Телефон<br><input name="phone" placeholder="+79991234567" required><br>
 Дата<br><input type="date" name="date" value="{{ day }}" required><br>
 Время<br><input name="time" value="{{ slot }}" required><br>
 Гостей<br><input type="number" name="guests" min="1" value="{{ guests }}" required><br>
 <button>Забронировать</button> <a href="/">Отмена</a>
</form>
{% endblock %}
