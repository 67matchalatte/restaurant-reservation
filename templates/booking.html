{% extends "base.html" %}{% block body %}
<h3>Оформление брони — столик {{ table_id }}</h3>
{% if error %}<p class="err">{{ error }}</p>{% endif %}
<form method="post" action="{{ url_for('booking_create') }}">
    <input type="hidden" name="table_id" value="{{ table_id }}">
    
    <div>
        <label for="booking-name">Имя</label><br>
        <input type="text" id="booking-name" name="name" required>
    </div>
    
    <div>
        <label for="booking-phone">Телефон</label><br>
        <input type="tel" id="booking-phone" name="phone" placeholder="+79991234567" required>
    </div>
    
    <div>
        <label for="booking-date">Дата</label><br>
        <input type="date" id="booking-date" name="date" value="{{ day }}" required>
    </div>
    
    <div>
        <label for="booking-time">Время</label><br>
        <input type="text" id="booking-time" name="time" value="{{ slot }}" required>
    </div>
    
    <div>
        <label for="booking-guests">Гостей</label><br>
        <input type="number" id="booking-guests" name="guests" min="1" value="{{ guests }}" required>
    </div>
    
    <button>Забронировать</button> <a href="/">Отмена</a>
</form>
{% endblock %}
