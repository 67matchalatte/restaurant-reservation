{% extends "base.html" %}{% block body %}
<h3>Схема зала</h3>
<form method="get">
    <div>
        <label for="hall-date">Дата</label>
        <input type="date" id="hall-date" name="date" value="{{ day }}">
    </div>
    <div>
        <label for="hall-time">Время</label>
        <select id="hall-time" name="time">
            {% for s in slots %}<option {{ 'selected' if s==slot }}>{{ s }}</option>{% endfor %}
        </select>
    </div>
    <button>Показать</button>
</form>

{% for t in tables %}
    <div class="t {{ 'free' if t.id in free_ids else 'busy' }}">
        <b>{{ t.id }}</b><br>
        {{ t.seats }} мест<br>
        {{ 'свободен' if t.id in free_ids else 'занят' }}
    </div>
{% endfor %}
{% endblock %}
